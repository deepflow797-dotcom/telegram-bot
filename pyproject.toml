[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rental-telegram-bot"
version = "1.0.0"
description = "Arabic Telegram bot for managing rental properties, tenants and payments"
requires-python = ">=3.11,<3.13"
# Vercel installs dependencies from this list with `uv` (it prefers
# pyproject.toml over requirements.txt), so it grows with requirements.txt.
# `uvicorn` is not needed on serverless hosts; it stays in requirements.txt for
# Docker/local use.
dependencies = [
  "aiogram==3.32.0",
  "fastapi==0.163.1",
  "psycopg[binary,pool]==3.3.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
