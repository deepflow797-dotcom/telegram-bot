[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rental-telegram-bot"
version = "1.0.0"
description = "Arabic Telegram bot for managing rental properties, tenants and payments"
requires-python = ">=3.11,<3.13"
# Vercel installs dependencies from this list (it prefers pyproject.toml over
# requirements.txt), so it must mirror requirements.txt. Extras are not applied
# by every installer, therefore psycopg's binary/pool extras are listed
# explicitly instead of using ``psycopg[binary,pool]``.
dependencies = [
  "aiogram==3.32.0",
  "fastapi==0.163.1",
  "psycopg==3.3.9",
  "psycopg-binary==3.3.9",
  "psycopg-pool==3.3.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
